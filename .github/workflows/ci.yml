name: CI

on:
  push:
    branches: [dev, prod, "claude-feature/**"]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python scripts/run_tests_ci.py
      - name: Wrapper provenance holds on this OS
        shell: bash
        run: |
          craftctl doctor | python -c "import sys,json; w=json.load(sys.stdin)['wrapper']; print(json.dumps(w['files'], indent=1)); sys.exit(0 if w['ok'] else 1)"

  fabric-build:
    name: Build examples/crystal_example (JDK 25, clean runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with the shipped wrapper
        working-directory: examples/crystal_example
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --console=plain 2>&1 | tee build.log
      - name: Surface javac errors as annotations
        if: failure()
        working-directory: examples/crystal_example
        shell: bash
        run: |
          grep -nE "error:|FAILURE|Caused by|What went wrong" build.log | head -40 | while IFS= read -r line; do echo "::error title=gradle::${line:0:400}"; done
          grep -A3 -E "error:" build.log | head -80
      - name: Inspect JAR
        working-directory: examples/crystal_example
        run: |
          ls -la build/libs
          unzip -p build/libs/crystal_example-1.0.0.jar META-INF/MANIFEST.MF
          unzip -l build/libs/crystal_example-1.0.0.jar | grep -E "loot_table/blocks/crystal_stone.json|ModMain.class"
      - uses: actions/upload-artifact@v4
        with:
          name: crystal_example-jar
          path: examples/crystal_example/build/libs/*.jar
          if-no-files-found: error

  generated-build:
    name: Generate a fresh project with craftctl and build it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install craftctl
        run: python -m pip install -e .
      - name: Controller-driven path (new → plan → approve → generate → request → grant → build)
        env:
          CRAFTCTL_HOME: ${{ runner.temp }}/craft
        run: |
          set -euo pipefail
          craftctl new --name "CI Mod" --id ci_mod --package com.example.cimod --idea "items: ci gem, ci dust; blocks: ci ore; mobs: ci critter; tab: CI Mod"
          craftctl add-material ci_mod --id ci --label CI --ingredient ci_gem --tools sword pickaxe --armor helmet boots > /dev/null
          craftctl add-food ci_mod --id ci_snack --label "CI Snack" --nutrition 3 --effect minecraft:speed:100:0:1.0 > /dev/null > /dev/null
          craftctl plan ci_mod > /dev/null
          craftctl approve-spec ci_mod > /dev/null
          craftctl generate ci_mod > /dev/null
          APPROVAL=$(craftctl request-build ci_mod | python -c "import sys,json; print(json.load(sys.stdin)['id'])")
          craftctl decide "$APPROVAL" grant > /dev/null
          craftctl build ci_mod --approval-id "$APPROVAL" | tee build.json
          python -c "import json; r=json.load(open('build.json')); assert r['status']=='BUILD_PASS', r; print('BUILD_PASS sha256', r['evidence']['artifact_sha256'])"
          craftctl status ci_mod | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='BUILD_PASSED_GAME_UNTESTED', d['status']; print('evidence:', [(e['level'], e['actor']) for e in d['evidence']])"
      - name: Show build log tail on failure
        if: failure()
        env:
          CRAFTCTL_HOME: ${{ runner.temp }}/craft
        shell: bash
        run: |
          craftctl logs ci_mod --lines 200 > build_tail.txt || true
          grep -nE "error:|Caused by|What went wrong" build_tail.txt | head -40 | while IFS= read -r line; do echo "::error title=craftctl build::${line:0:400}"; done
          cat build_tail.txt

  blockbench-oracle:
    name: blockbench-mcp-safe vs upstream oracle (Linux only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Safe server self-tests
        working-directory: tools/blockbench-mcp-safe
        run: node --test
      - name: Build a critter with the safe server and cross-check with the upstream validators + exporter
        run: python scripts/blockbench_oracle.py
