[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-mod-orchestra"
version = "0.1.0"
description = "Local-first agent orchestration foundation for Minecraft Java mod projects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Minecraft Mod Orchestra Contributors"}]
keywords = ["minecraft", "fabric", "mcp", "modding", "agents"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
craftctl = "mod_orchestra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mod_orchestra = ["static/*", "resources/gradle-wrapper/*", "resources/gradle-wrapper/gradle/wrapper/*", "resources/claude/*", "resources/claude/agents/*", "resources/claude/hooks/*", "resources/claude/skills/*/*"]
